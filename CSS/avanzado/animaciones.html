<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
      .cuadro {
        background-color: rgb(118, 1, 1);
        width: 100px;
        height: 10px;
        animation: cambiarFondo 5s infinite;
        animation-timing-function: ease;
      }

      @keyframes cambiarFondo {
        0% {
          background-color: rgb(118, 1, 1);
          top: 0;
          left: 0;
          border-radius: 140% 100% 30% 300%
        }
        25% {
          background-color: cadetblue;
          top: 50px;
          left: 0;
          border-radius: 200% 5% 120% 100%
        }
        50% {
          background-color: rgb (88, 129, 13);
          top: 50px;
          left: 50px;
          border-radius: 50% 80% 200% 80%
        }
        75% {
          background-color: rgb(75, 38, 155);
          top: 0;
          left: 50px;
          border-radius: 100% 20% 20% 100%
        }
        100% {
          background-color: rgb(118, 1, 1);
          top: 0;
          left: 0;
          border-radius: 140% 100% 30% 300%
        }
      /*
      haz una aminacion sobre un parrafp que
      - dure 7 segunda
      - el texto cambie grosor de una pequeta
      */
      }
    </style>
  </head>
